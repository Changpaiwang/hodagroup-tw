══════════════════════════════════════════════════ -->
<section id="quiz" style="background:var(--cream-dark);padding:72px 20px;">
<div style="max-width:680px;margin:0 auto;">

  <!-- 標題 -->
  <div style="text-align:center;margin-bottom:36px;">
    <div style="display:inline-block;background:#e05c2a;color:#fff;font-size:0.7rem;font-weight:700;letter-spacing:2px;padding:5px 14px;border-radius:20px;margin-bottom:12px;">禾大屋管・免費確認工具</div>
    <h2 style="font-family:'Noto Serif TC',serif;font-size:1.6rem;font-weight:700;color:var(--green-deep);margin:0 0 10px;">一鍵確認你的租金補貼資格</h2>
    <p style="color:var(--text-soft);font-size:0.9rem;margin:0;">回答 7 個問題，立即顯示你的預估補貼金額與申請建議</p>
  </div>

  <!-- 卡片 -->
  <div id="qz-card" style="background:#fff;border-radius:14px;box-shadow:0 4px 30px rgba(0,0,0,0.08);padding:36px 40px;position:relative;overflow:hidden;">

    <!-- 進度條 -->
    <div style="height:4px;background:#eee;border-radius:2px;margin-bottom:28px;">
      <div id="qz-bar" style="height:4px;background:var(--green-mid);border-radius:2px;width:14%;transition:width .4s;"></div>
    </div>
    <div id="qz-step-label" style="font-size:0.72rem;color:var(--text-soft);letter-spacing:1px;margin-bottom:18px;">步驟 1 / 7</div>

    <!-- 問題區塊 -->
    <div id="qz-body"></div>

    <!-- 按鈕列 -->
    <div id="qz-nav" style="display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;"></div>
  </div>

</div>
</section>

<style>

.qz-cta-a{padding:10px 20px;border-radius:6px;font-size:0.85rem;font-weight:700;text-decoration:none;transition:all .2s;}
.qz-cta-line{background:var(--gold);color:var(--green-deep);}
.qz-cta-line:hover{background:#e0bf74;}
.qz-cta-gov{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}

.qz-result-no{text-align:center;}
.qz-no-icon{font-size:2.4rem;margin-bottom:10px;}
.qz-no-title{font-family:'Noto Serif TC',serif;font-size:1.2rem;font-weight:700;color:var(--green-deep);margin-bottom:8px;}
.qz-no-msg{font-size:0.87rem;color:var(--text-mid);line-height:1.7;margin-bottom:18px;}
.qz-restart{background:var(--green-mid);color:#fff;border:none;padding:12px 28px;border-radius:6px;cursor:pointer;font-weight:700;font-family:'Noto Sans TC',sans-serif;}
@media(max-width:600px){
  #qz-card{padding:24px 18px;}
  .qz-result-amount{font-size:2.2rem;}
  .qz-cta-btns{flex-direction:column;}
}
</style>
